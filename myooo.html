<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حساب کتاب</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; }
        h2 { color: #2c3e50; }
        label { font-weight: bold; display: block; margin-top: 15px; margin-bottom: 5px; }
        input[type="number"] { padding: 10px; border: 1px solid #ddd; border-radius: 5px; width: 100%; box-sizing: border-box; }
        button { padding: 12px 20px; background-color: #3498db; color: white; border: none; border-radius: 5px; margin-top: 20px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #2980b9; }
        .result { margin-top: 20px; font-size: 18px; font-weight: bold; color: #27ae60; }
    </style>
</head>
<body>

<div class="container">
    <h2>دو نمبر جمع کریں</h2>
    
    <label for="num1">پہلا نمبر درج کریں:</label>
    <input type="number" id="num1">

    <label for="num2">دوسرا نمبر درج کریں:</label>
    <input type="number" id="num2">

    <button onclick="addNumbers()">جمع کریں</button>

    <div id="result" class="result"></div>
</div>

<script>
    function addNumbers() {
        const num1 = parseFloat(document.getElementById('num1').value);
        const num2 = parseFloat(document.getElementById('num2').value);

        if (!isNaN(num1) && !isNaN(num2)) {
            const sum = num1 + num2;
            document.getElementById('result').innerText = 'نتیجہ: ' + sum;
        } else {
            document.getElementById('result').innerText = 'براہ کرم درست نمبر درج کریں۔';
        }
    }
</script>

</body>
</html>
