        /* ========== IFRAME WITH CUSTOM OVERLAY ========== */
        .iframe-wrapper {
            position: relative;
            margin-top: 15px;
            background-color: #fff;
            height: calc(100vh - 150px);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        
        .iframe-container {
            height: 100%;
            overflow: hidden;
            position: relative;
        }
        
        .iframe-sticky {
            position: fixed;
            top: 70px;
            left: 0;
            right: 0;
            bottom: 85px;
            z-index: 50;
            height: auto !important;
        }
        
        .iframe-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        
        .iframe-overlay {
            position: absolute;
            top: 70px;
            left: 0;
            width: 100%;
            height: calc(100% - 70px);
            background-color: transparent;
            z-index: 60;
            pointer-events: auto;
        }
        
        .iframe-sticky .iframe-overlay {
            pointer-events: none;
        }



        /* ========== MOBILE OPTIMIZATIONS ========== */
        @media (max-width: 480px) {
            .banner-container {
                height: 160px;
            }
            .category-item {

            }

                height: calc(100vh - 140px);
            }

function showbottombar(activeIcon) {
    const navItems = [
        { name: 'home', label: 'Home', url: '/home.html' },
        { name: 'cata', label: 'Categories', url: '/categories.html' },
        { name: 'cart', label: 'Cart', url: '/cart.html' },
        { name: 'profile', label: 'Account', url: '/profile.html' }
    ];
    
    const cartCount = localStorage.getItem('cartCount') || 0;
    
    let html = '';
    
    navItems.forEach(item => {
        const isActive = item.name === activeIcon;
        const imgSrc = isActive ? `/gsh/${item.name} 1.svg` : `/gsh/${item.name}.svg`;
        const activeClass = isActive ? 'nav-item active' : 'nav-item';
        
        html += `
            <a href="${item.url}" target="_top" class="${activeClass}">
                <img src="${imgSrc}" class="icon" alt="${item.label}">
                <span class="nav-label">${item.label}</span>
                ${item.name === 'cart' && cartCount > 0 ? `<span class="cart-badge">${cartCount}</span>` : ''}
            </a>
        `;
    });
    
    document.getElementById('bottom-bar').innerHTML = html;
    
    main(); // optional main() call
}

        // ========== DYNAMIC DATA ==========
        const bannerImages = [
            { img: "https://img.freepik.com/free-vector/flat-sale-banner-with-photo_23-2149026968.jpg", link: "#" },
            { img: "https://img.freepik.com/free-vector/gradient-sale-banner-template_23-2148934474.jpg", link: "#" },
            { img: "https://img.freepik.com/free-vector/gradient-black-friday-sale-banner_23-2149026965.jpg", link: "#" }
        ];

        const categories = [
            { name: "Mobiles", icon: "smartphone-line" },
            { name: "Electronics", icon: "computer-line" },
            { name: "Fashion", icon: "t-shirt-line" },
            { name: "Home", icon: "home-3-line" },
            { name: "Beauty", icon: "heart-line" },
            { name: "Groceries", icon: "shopping-basket-line" },
            { name: "Sports", icon: "football-line" },
            { name: "Kids", icon: "bear-smile-line" },
            { name: "Books", icon: "book-line" },
            { name: "More", icon: "more-2-line" }
        ];

        // ========== INITIALIZATION FUNCTIONS ==========
        function initBanner() {
            const bannerSlider = document.getElementById('bannerSlider');
            const bannerDots = document.getElementById('bannerDots');

            bannerImages.forEach((banner, index) => {
                // Add slide
                const slide = document.createElement('div');
                slide.className = 'banner-slide';
                slide.innerHTML = `<a href="${banner.link}"><img src="${banner.img}" alt="Banner ${index + 1}"></a>`;
                bannerSlider.appendChild(slide);

                // Add dot
                const dot = document.createElement('div');
                dot.className = 'banner-dot' + (index === 0 ? ' active' : '');
                dot.addEventListener('click', () => goToSlide(index));
                bannerDots.appendChild(dot);
            });

            // Auto slide
            let currentSlide = 0;
            const slides = document.querySelectorAll('.banner-slide');
            const dots = document.querySelectorAll('.banner-dot');

            function goToSlide(index) {
                currentSlide = index;
                bannerSlider.style.transform = `translateX(-${currentSlide * 100}%)`;
                dots.forEach((dot, i) => {
                    dot.classList.toggle('active', i === currentSlide);
                });
            }

            function nextSlide() {
                currentSlide = (currentSlide + 1) % slides.length;
                goToSlide(currentSlide);
            }

            setInterval(nextSlide, 3000);
        }

        function initCategories() {
            const categoryList = document.getElementById('categoryList');
            categories.forEach(category => {
                const item = document.createElement('div');
                item.className = 'category-item';
                item.innerHTML = `
                    <i class="ri-${category.icon}"></i>
                    <span class="category-name">${category.name}</span>
                `;
                categoryList.appendChild(item);
            });
        }

       

        // ========== IFRAME WITH CUSTOM OVERLAY ==========
        function setupStickyIframe() {
            const iframeWrapper = document.getElementById('iframeWrapper');
            const iframeContainer = document.getElementById('iframeContainer');
            const overlay = document.getElementById('iframeOverlay');
            const topBarHeight = 70;
            const bottomBarHeight = 85;
            
            function handleScroll() {
                const wrapperRect = iframeWrapper.getBoundingClientRect();
                
                if (wrapperRect.top <= topBarHeight) {
                    iframeContainer.classList.add('iframe-sticky');
                    iframeContainer.style.height = `calc(100vh - ${topBarHeight + bottomBarHeight}px)`;
                    overlay.style.pointerEvents = 'none';
                } else {
                    iframeContainer.classList.remove('iframe-sticky');
                    iframeContainer.style.height = '100%';
                    overlay.style.pointerEvents = 'auto';
                }
            }

            let ticking = false;
            window.addEventListener('scroll', function() {
                if (!ticking) {
                    window.requestAnimationFrame(function() {
                        handleScroll();
                        ticking = false;
                    });
                    ticking = true;
                }
            });
            
            window.addEventListener('resize', handleScroll);
            handleScroll();
        }

        // Initialize components when DOM is loaded
        document.addEventListener('DOMContentLoaded', function() {
            initBanner();
            initCategories();
            
            setupStickyIframe();
        });
    </script>
