<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Product</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Basic styles for inputs, buttons, and layout */
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 800px;
            margin: auto;
        }

        h2 {
            color: #088178;
        }

        input, textarea {
            width: calc(100% - 20px);
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
            box-sizing: border-box;
        }

        .btn {
            padding: 10px 20px;
            background-color: #088178;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .btn:hover {
            background-color: #065e54;
        }

        textarea {
            height: 150px;
            resize: none;
        }
    </style>
</head>
<body>
    <h2>Add New Product</h2>
    <input type="text" id="productName" placeholder="Product Name" required>
    <input type="text" id="productType" placeholder="Type" required>
    <input type="text" id="productCategory" placeholder="Category" required>
    <input type="text" id="productImage" placeholder="Image URL" required>
    <button class="btn" id="addProduct">Add Product</button>
   

    <h2>Update or Delete Product</h2>
    <input type="text" id="productId" placeholder="Enter Product ID" required>
    <button class="btn" id="fetchProduct">Fetch Product</button>
    <textarea id="productData" placeholder="Product data will appear here" readonly></textarea>
    <button class="btn" id="updateProduct">Update Product</button>
    <button class="btn" id="deleteProduct">Delete Product</button>

    <!-- Firebase App and Firestore SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.x/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.x/firebase-firestore.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc, updateDoc, deleteDoc, collection, addDoc } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

        // Firebase configuration
        const firebaseConfig = {
  apiKey: "AIzaSyCODU5GVwDHlnb8lyc-w7fcqx25_MS55KA",
  authDomain: "gzjsvkzhhsjhsb.firebaseapp.com",
  projectId: "gzjsvkzhhsjhsb",
  storageBucket: "gzjsvkzhhsjhsb.firebasestorage.app",
  messagingSenderId: "969885928112",
  appId: "1:969885928112:web:5121178f1d0c1125ad8975"
};

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Utility function to clear inputs
        const clearInputs = () => {
            document.getElementById("productName").value = '';
            document.getElementById("productType").value = '';
            document.getElementById("productCategory").value = '';
            document.getElementById("productImage").value = '';
            document.getElementById("productId").value = '';
            document.getElementById("productData").value = '';
        };

        // Add product
        document.getElementById("addProduct").addEventListener("click", async () => {
            const product = {
                name: document.getElementById("productName").value.trim(),
                type: document.getElementById("productType").value.trim(),
                category: document.getElementById("productCategory").value.trim(),
                image: document.getElementById("productImage").value.trim()
            };

            if (!product.name || !product.type || !product.category || !product.image) {
                alert("Please fill all the fields.");
                return;
            }

            try {
                const docRef = await addDoc(collection(db, "data"), product);
                alert("Product added successfully with ID: " + docRef.id);
                console.log(docRef.id)
                clearInputs();
            } catch (error) {
                console.error("Error adding product: ", error);
                alert("Failed to add product. Please try again.");
            }
        });

        // Fetch product by ID
        document.getElementById("fetchProduct").addEventListener("click", async () => {
            const productId = document.getElementById("productId").value.trim();
            if (!productId) {
                alert("Please enter a product ID.");
                return;
            }

            try {
                const docRef = doc(db, "data", productId);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    document.getElementById("productData").value = JSON.stringify(docSnap.data(), null, 4);
                } else {
                    alert("No product found with this ID.");
                }
            } catch (error) {
                console.error("Error fetching product: ", error);
                alert("Failed to fetch product. Please try again.");
            }
        });

        // Update product
        document.getElementById("updateProduct").addEventListener("click", async () => {
            const productId = document.getElementById("productId").value.trim();
            let updatedData;
            try {
                updatedData = JSON.parse(document.getElementById("productData").value);
            } catch (error) {
                alert("Invalid JSON format in product data.");
                return;
            }

            if (!productId || !updatedData) {
                alert("Please provide both product ID and updated data.");
                return;
            }

            try {
                const docRef = doc(db, "data", productId);
                await updateDoc(docRef, updatedData);
                alert("Product updated successfully!");
                clearInputs();
            } catch (error) {
                console.error("Error updating product: ", error);
                alert("Failed to update product. Please try again.");
            }
        });

        // Delete product
        document.getElementById("deleteProduct").addEventListener("click", async () => {
            const productId = document.getElementById("productId").value.trim();
            if (!productId) {
                alert("Please enter a product ID.");
                return;
            }

            try {
                const docRef = doc(db, "data", productId);
                await deleteDoc(docRef);
                alert("Product deleted successfully!");
                clearInputs();
            } catch (error) {
                console.error("Error deleting product: ", error);
                alert("Failed to delete product. Please try again.");
            }
        });
    </script>
</body>
</html>
