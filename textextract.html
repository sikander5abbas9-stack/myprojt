<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7 Advance Hacker Elements</title>
    <style>
        body {
            background: #050505;
            color: #00d4ff;
            font-family: 'Courier New', monospace;
            padding: 50px;
        }

        .element-item {
            margin-bottom: 40px;
            border-left: 3px solid #00d4ff;
            padding-left: 20px;
        }

        /* 1. Pulse Scanner */
        .pulse-scanner {
            width: 50px; height: 50px;
            background: #00d4ff;
            border-radius: 50%;
            position: relative;
        }
        .pulse-scanner::after {
            content: "";
            position: absolute;
            width: 100%; height: 100%;
            border: 2px solid #00d4ff;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(3); opacity: 0; }
        }

        /* 2. Binary Loading Bar */
        .binary-bar {
            width: 250px; height: 20px;
            border: 1px solid #00d4ff;
            position: relative;
            overflow: hidden;
            background: rgba(0, 255, 65, 0.1);
        }
        .binary-bar::before {
            content: "1010101010101010101010101010";
            position: absolute;
            font-size: 14px;
            white-space: nowrap;
            animation: flow 2s linear infinite;
        }
        @keyframes flow {
            from { left: -100%; }
            to { left: 100%; }
        }

        /* 3. Glitch Text */
        .glitch-text {
            font-size: 24px;
            font-weight: bold;
            position: relative;
            animation: glitch 1s infinite;
        }
        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); color: #ff00c1; }
            40% { transform: translate(-2px, -2px); color: #00fff9; }
            60% { transform: translate(2px, 2px); color: #00d4ff; }
            80% { transform: translate(2px, -2px); }
            100% { transform: translate(0); }
        }

        /* 4. Rotating Hexagon (SVG) */
        .hex-rotate {
            width: 60px;
            animation: spin 4s linear infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* 5. Data Signal Dots */
        .signal-dot {
            display: inline-block;
            width: 10px; height: 10px;
            background: #00d4ff;
            border-radius: 50%;
            margin-right: 5px;
            animation: blink 0.8s infinite;
        }
        .dot-2 { animation-delay: 0.2s; }
        .dot-3 { animation-delay: 0.4s; }
        @keyframes blink { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }

        /* 6. Scanning Line */
        .scan-container {
            width: 200px; height: 100px;
            border: 1px solid rgba(0, 255, 65, 0.3);
            position: relative;
            background: rgba(0, 255, 65, 0.05);
        }
        .scan-line {
            width: 100%; height: 2px;
            background: #00d4ff;
            box-shadow: 0 0 10px #00d4ff;
            position: absolute;
            animation: scan 2s ease-in-out infinite;
        }
        @keyframes scan { 0%, 100% { top: 0%; } 50% { top: 100%; } }

        /* 7. Matrix Character Switch */
        #char-switch { font-size: 22px; }

    </style>
</head>
<body>

    <div class="element-item">
        <h4>1. Pulse Radar (Tracking)</h4>
        <div class="pulse-scanner"></div>
    </div>

    <div class="element-item">
        <h4>2. Data Stream Bar</h4>
        <div class="binary-bar"></div>
    </div>

    <div class="element-item">
        <h4>3. System Glitch Alert</h4>
        <div class="glitch-text">ACCESS DENIED</div>
    </div>

    <div class="element-item">
        <h4>4. Core Processor (Rotation)</h4>
        <svg class="hex-rotate" viewBox="0 0 100 100">
            <polygon points="50,5 95,25 95,75 50,95 5,75 5,25" fill="none" stroke="#00ff41" stroke-width="2"/>
        </svg>
    </div>

    <div class="element-item">
        <h4>5. Connection Signals</h4>
        <div class="signal-dot"></div>
        <div class="signal-dot dot-2"></div>
        <div class="signal-dot dot-3"></div>
    </div>

    <div class="element-item">
        <h4>6. Area Scanner</h4>
        <div class="scan-container">
            <div class="scan-line"></div>
        </div>
    </div>

    <div class="element-item">
        <h4>7. Matrix Char Generator</h4>
        <div id="char-switch">X</div>
    </div>

    <script>
        // Element 7: Random Character Switcher
        const chars = "01$#!@%&*ABCDEFGHIJKLMNOPQRSTUVWXYZ";
        setInterval(() => {
            const el = document.getElementById('char-switch');
            el.innerText = chars[Math.floor(Math.random() * chars.length)];
        }, 100);
    </script>

</body>
</html>
