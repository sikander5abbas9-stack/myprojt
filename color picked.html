<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Color Picker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #EBEBEB;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        #fileInput {
            margin: 20px;
        }

        #imageContainer {
            position: relative;
            margin: 20px auto;
            width: 80%;
            max-width: 800px;
            border: 2px solid #ccc;
            overflow: hidden;
            margin-bottom: 200px;
        }

        #imageContainer img {
            width: 100%;
            height: auto;
        }

        #colorPicker {
            width: 20px;
            height: 20px;
            position: absolute;
            pointer-events: none;
            border-radius: 50%;
            border: 2px solid #fff;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.3);
            transform: translate(-50%, -50%);
        }

        #colorInfo {
            position: fixed;
            bottom: 0px;
            width: 100%;
            left: 0;
            gap: 5px;
            background-color: #fff;
            padding: 20px 40px;
            border-radius: 5px;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.2);
            font-size: 16px;
            color: #333;
        }
    </style>
</head>
<body>

    <input type="file" id="fileInput" accept="image/*">
    <div id="imageContainer"></div>
    <div id="colorInfo">Hover over the image to see the color</div>

    <script>
        function handleFileInput() {
            const fileInput = document.getElementById('fileInput');
            const imageContainer = document.getElementById('imageContainer');

            if (fileInput.files.length > 0) {
                const selectedFile = fileInput.files[0];
                const imageUrl = URL.createObjectURL(selectedFile);

                imageContainer.innerHTML = `<img id="selectedImage" src="${imageUrl}" alt="Selected image">`;

                setupColorPicker();
            } else {
                alert('Please select an image file first.');
            }
        }

        function setupColorPicker() {
            const image = document.getElementById('selectedImage');
            const imageContainer = document.getElementById('imageContainer');
            const colorPicker = document.createElement('div');
            colorPicker.id = 'colorPicker';
            imageContainer.appendChild(colorPicker);

            image.addEventListener('mousemove', function (event) {
                const rect = image.getBoundingClientRect();
                const x = event.clientX - rect.left;
                const y = event.clientY - rect.top;

                // Update colorPicker position
                colorPicker.style.left = `${event.clientX - rect.left}px`;
                colorPicker.style.top = `${event.clientY - rect.top}px`;

                // Get color data
                const imageData = getImageDataAtPoint(image, x, y);
                const rgbColor = `rgb(${imageData[0]}, ${imageData[1]}, ${imageData[2]})`;
                const hexColor = rgbToHex(imageData[0], imageData[1], imageData[2]);

                // Update color info
                const colorInfo = document.getElementById('colorInfo');
                colorInfo.innerHTML = `<p>RGB: ${rgbColor}</p><p> HEX: ${hexColor} </p> <div class="div">
                   .
                </div>`;
                document.querySelector('.div').style.backgroundColor = hexColor;
                colorPicker.style.backgroundColor = hexColor;
            });
        }

        function getImageDataAtPoint(image, x, y) {
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');

            canvas.width = image.width;
            canvas.height = image.height;
            context.drawImage(image, 0, 0, image.width, image.height);

            return context.getImageData(x, y, 1, 1).data;
        }

        function rgbToHex(r, g, b) {
            return `#${((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1).toUpperCase()}`;
        }

        document.getElementById('fileInput').addEventListener('change', handleFileInput);
    </script>

</body>
</html>
