<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Advanced Photo Editor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f0f0;
      padding: 10px;
      margin: 0;
      text-align: center;
    }
    canvas {
      border: 1px solid #ccc;
      margin: 10px auto;
      max-width: 100%;
      display: block;
    }
    .controls {
      background: white;
      padding: 10px;
      border-radius: 10px;
      box-shadow: 0 0 10px #aaa;
      overflow-x: auto;
      display: flex;
      flex-direction: row;
      gap: 10px;
    }
    .slider-container {
      display: flex;
      flex-direction: column-reverse;
      align-items: center;
      min-width: 60px;
    }
    .slider-container label {
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      margin-bottom: 5px;
      font-size: 14px;
    }
    input[type="range"] {
      writing-mode: bt-lr;
      -webkit-appearance: slider-vertical;
      width: 30px;
      height: 120px;
    }
    .button-container {
      margin-top: 15px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
    }
    button {
      margin: 5px;
      padding: 10px 15px;
      border: none;
      background: #088178;
      color: white;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background: #06665e;
    }
    @media (max-width: 600px) {
      .slider-container label {
        font-size: 12px;
      }
      input[type="range"] {
        height: 100px;
      }
    }
  </style>
</head>
<body>

  <h2>📸 Advanced Photo Editor</h2>
  <input type="file" id="upload" accept="image/*"><br><br>
  <canvas id="canvas"></canvas>

  <div class="controls">
    <div class="slider-container"><label>Exposure</label><input type="range" id="exposure" min="-100" max="100" value="0"></div>
    <div class="slider-container"><label>Brilliance</label><input type="range" id="brilliance" min="-100" max="100" value="0"></div>
    <div class="slider-container"><label>Highlights</label><input type="range" id="highlights" min="-100" max="100" value="0"></div>
    <div class="slider-container"><label>Shadows</label><input type="range" id="shadows" min="-100" max="100" value="0"></div>
    <div class="slider-container"><label>Contrast</label><input type="range" id="contrast" min="0" max="200" value="100"></div>
    <div class="slider-container"><label>Brightness</label><input type="range" id="brightness" min="0" max="200" value="100"></div>
    <div class="slider-container"><label>Black Point</label><input type="range" id="blackpoint" min="0" max="100" value="0"></div>
    <div class="slider-container"><label>Saturation</label><input type="range" id="saturation" min="0" max="200" value="100"></div>
    <div class="slider-container"><label>Vibrancy</label><input type="range" id="vibrancy" min="0" max="200" value="100"></div>
    <div class="slider-container"><label>Warmth</label><input type="range" id="warmth" min="-100" max="100" value="0"></div>
    <div class="slider-container"><label>Tint</label><input type="range" id="tint" min="-100" max="100" value="0"></div>
    <div class="slider-container"><label>Vignette</label><input type="range" id="vignette" min="0" max="1" step="0.01" value="0"></div>
    <div class="slider-container"><label>Sharpness</label><input type="range" id="sharpness" min="0" max="100" value="0"></div>
    <div class="slider-container"><label>Definition</label><input type="range" id="definition" min="0" max="100" value="0"></div>
    <div class="slider-container"><label>Noise Reduction</label><input type="range" id="noise" min="0" max="100" value="0"></div>
  </div>

  <div class="button-container">
    <button onclick="applyVivid()">Apply Vivid Filter</button>
    <button onclick="resetFilters()">Reset</button>
    <button onclick="downloadImage()">Download Image</button>
  </div>

  <script>
    const upload = document.getElementById('upload');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let img = new Image();
    let originalImg = null;

    upload.onchange = function(e) {
      const reader = new FileReader();
      reader.onload = function(event) {
        img.onload = function() {
          canvas.width = img.width;
          canvas.height = img.height;
          ctx.drawImage(img, 0, 0);
          originalImg = ctx.getImageData(0, 0, canvas.width, canvas.height);
        }
        img.src = event.target.result;
      }
      reader.readAsDataURL(e.target.files[0]);
    }

    const filters = ['exposure','brilliance','highlights','shadows','contrast','brightness','blackpoint','saturation','vibrancy','warmth','tint','vignette','sharpness','definition','noise'];
    filters.forEach(id => document.getElementById(id).oninput = applyFilters);

    function applyFilters() {
      if (!originalImg) return;
      ctx.putImageData(originalImg, 0, 0);
      let imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      let data = imageData.data;

      const exposure = parseInt(document.getElementById('exposure').value);
      const brilliance = parseInt(document.getElementById('brilliance').value);
      const highlights = parseInt(document.getElementById('highlights').value);
      const shadows = parseInt(document.getElementById('shadows').value);
      const contrast = parseFloat(document.getElementById('contrast').value)/100;
      const brightness = parseFloat(document.getElementById('brightness').value)/100;
      const blackpoint = parseInt(document.getElementById('blackpoint').value);
      const saturation = parseFloat(document.getElementById('saturation').value)/100;
      const vibrancy = parseFloat(document.getElementById('vibrancy').value)/100;
      const warmth = parseInt(document.getElementById('warmth').value);
      const tint = parseInt(document.getElementById('tint').value);
      const sharpness = parseInt(document.getElementById('sharpness').value);
      const definition = parseInt(document.getElementById('definition').value);
      const noise = parseInt(document.getElementById('noise').value);

      for (let i = 0; i < data.length; i += 4) {
        let r = data[i], g = data[i+1], b = data[i+2];

        r += exposure + brilliance; g += exposure + brilliance; b += exposure + brilliance;

        if ((r+g+b)/3 > 127) {
          r += highlights; g += highlights; b += highlights;
        } else {
          r += shadows; g += shadows; b += shadows;
        }

        r = Math.max(r - blackpoint, 0);
        g = Math.max(g - blackpoint, 0);
        b = Math.max(b - blackpoint, 0);

        const avg = (r+g+b)/3;
        r = r + (r - avg) * (saturation - 1);
        g = g + (g - avg) * (saturation - 1);
        b = b + (b - avg) * (vibrancy - 1);

        r += warmth; b -= warmth;

        g += tint; r -= tint/2; b -= tint/2;

        r = ((r - 128) * contrast + 128) * brightness;
        g = ((g - 128) * contrast + 128) * brightness;
        b = ((b - 128) * contrast + 128) * brightness;

        if (definition > 0) {
          r += definition * 0.1; g += definition * 0.1; b += definition * 0.1;
        }
        if (noise > 0) {
          r -= noise * 0.1; g -= noise * 0.1; b -= noise * 0.1;
        }

        data[i] = Math.min(255, Math.max(0, r));
        data[i+1] = Math.min(255, Math.max(0, g));
        data[i+2] = Math.min(255, Math.max(0, b));
      }

      ctx.putImageData(imageData, 0, 0);
      applyVignetteOverlay();
    }

    function applyVignetteOverlay() {
      const vignette = parseFloat(document.getElementById('vignette').value);
      if (vignette <= 0) return;
      const gradient = ctx.createRadialGradient(
        canvas.width/2, canvas.height/2, 0,
        canvas.width/2, canvas.height/2, Math.max(canvas.width, canvas.height)/1.3
      );
      gradient.addColorStop(0, 'rgba(0,0,0,0)');
      gradient.addColorStop(1, `rgba(0,0,0,${vignette})`);
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    function applyVivid() {
      document.getElementById('exposure').value = 10;
      document.getElementById('contrast').value = 130;
      document.getElementById('saturation').value = 150;
      document.getElementById('vibrancy').value = 150;
      document.getElementById('brightness').value = 110;
      applyFilters();
    }

    function resetFilters() {
      filters.forEach(id => {
        const el = document.getElementById(id);
        el.value = (el.type === 'range' && el.step === '0.01') ? 0 : (el.min < 0 ? 0 : 100);
      });
      applyFilters();
    }

    function downloadImage() {
      const link = document.createElement('a');
      link.download = 'edited-image.png';
      link.href = canvas.toDataURL();
      link.click();
    }
  </script>
</body>
</html>
