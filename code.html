<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Interface</title>
    <style>
        :root {
            --primary: #4285f4;
            --secondary: #34a853;
            --user-bubble: #e3f2fd;
            --bot-bubble: #f8f9fa;
            --error: #ea4335;
            --text-dark: #202124;
            --text-light: #5f6368;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        
        body {
            font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #f5f5f5;
            color: var(--text-dark);
            line-height: 1.6;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 100%;
            margin: 0 auto;
            background: white;
            height: 100vh;
            width: 100%;
            overflow: hidden;
        }
        
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 15px 10px;
            background-color: #f9f9f9;
            -webkit-overflow-scrolling: touch;
        }
        
        .message {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
        }
        
        .user-message {
            align-items: flex-end;
        }
        
        .bot-message {
            align-items: flex-start;
        }
        
        .bubble {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 18px;
            margin-bottom: 4px;
            line-height: 1.5;
            word-wrap: break-word;
            font-size: 0.95rem;
            position: relative;
        }
        
        .user-bubble {
            background: var(--user-bubble);
            border-bottom-right-radius: 4px;
            color: var(--text-dark);
            box-shadow: 0 1px 1px rgba(0,0,0,0.1);
            user-select: text;
        }
        
        .bot-bubble {
            background: var(--bot-bubble);
            border-bottom-left-radius: 4px;
            color: var(--text-dark);
            box-shadow: 0 1px 1px rgba(0,0,0,0.05);
            user-select: text;
        }
        
        /* Markdown styling */
        .bot-bubble strong {
            font-weight: bold;
            color: #000;
        }
        
        .bot-bubble em {
            font-style: italic;
        }
        
        .bot-bubble code {
            font-family: 'Courier New', monospace;
            background: #f0f0f0;
            padding: 2px 4px;
            border-radius: 3px;
            font-size: 0.9em;
        }
        
        .bot-bubble pre {
            background: #f0f0f0;
            padding: 10px;
            border-radius: 6px;
            overflow-x: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            margin: 8px 0;
            white-space: pre-wrap;
        }
        
        .bot-bubble ul, .bot-bubble ol {
            padding-left: 20px;
            margin: 8px 0;
        }
        
        .bot-bubble li {
            margin-bottom: 4px;
        }
        
        .time {
            font-size: 0.7rem;
            color: var(--text-light);
            margin-top: 2px;
            user-select: none;
        }
        
        .input-area {
            display: flex;
            gap: 8px;
            padding: 12px;
            background: white;
            border-top: 1px solid #e0e0e0;
        }
        
        #messageInput {
            flex: 1;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 24px;
            outline: none;
            font-size: 0.95rem;
            background: #f9f9f9;
        }
        
        #sendButton {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        #sendButton:disabled {
            background: #cccccc;
            cursor: not-allowed;
        }
        
        #sendButton svg {
            width: 20px;
            height: 20px;
            fill: white;
        }
        
        .typing {
            display: none;
            padding: 10px 16px;
            background: var(--bot-bubble);
            border-radius: 18px;
            margin-bottom: 15px;
            align-self: flex-start;
            width: fit-content;
        }
        
        .typing-dots {
            display: flex;
            gap: 5px;
        }
        
        .typing-dot {
            width: 8px;
            height: 8px;
            background: var(--text-light);
            border-radius: 50%;
            animation: typing 1.4s infinite ease-in-out;
        }
        
        .typing-dot:nth-child(1) { animation-delay: 0s; }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        
        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-5px); }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-area" id="chatArea">
            <div class="typing" id="typingIndicator">
                <div class="typing-dots">
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                </div>
            </div>
        </div>
        
        <div class="input-area">
            <input type="text" id="messageInput" placeholder="Type your message..." autocomplete="off">
            <button id="sendButton" disabled>
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                </svg>
            </button>
        </div>
    </div>

    <script>
        // DOM Elements
        const chatArea = document.getElementById('chatArea');
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');
        const typingIndicator = document.getElementById('typingIndicator');
        
        // API Configuration
        const API_KEY = "AIzaSyC76CmIftlETvhGyHXDxZ_BIA2lyTIAFK0";
        const MODEL_NAME = "gemini-1.5-pro-latest";
        const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent?key=${API_KEY}`;
        
        // Enable send button when input has text
        messageInput.addEventListener('input', () => {
            sendButton.disabled = messageInput.value.trim() === '';
        });
        
        // Send message on Enter key
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !sendButton.disabled) {
                sendMessage();
            }
        });
        
        // Send message on button click
        sendButton.addEventListener('click', sendMessage);
        
        function sendMessage() {
            const message = messageInput.value.trim();
            if (!message) return;
            
            // Add user message to chat
            addMessage(message, 'user');
            
            // Clear input
            messageInput.value = '';
            sendButton.disabled = true;
            
            // Show typing indicator
            typingIndicator.style.display = 'flex';
            chatArea.scrollTop = chatArea.scrollHeight;
            
            // Prepare request
            const requestBody = {
                contents: [
                    {
                        role: "user",
                        parts: [
                            { text: message }
                        ]
                    }
                ],
                generationConfig: {
                    temperature: 0.9,
                    topP: 0.95,
                    topK: 40,
                    maxOutputTokens: 2048
                }
            };
            
            // Call Gemini API
            fetch(API_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(requestBody)
            })
            .then(response => {
                if (!response.ok) {
                    return response.json().then(err => { throw err; });
                }
                return response.json();
            })
            .then(data => {
                if (data.candidates?.[0]?.content?.parts?.[0]?.text) {
                    const responseText = data.candidates[0].content.parts[0].text;
                    addMessage(responseText, 'bot');
                } else {
                    throw new Error('Unexpected response format');
                }
            })
            .catch(error => {
                console.error("Error details:", error);
                const errorMsg = error.error?.message || error.message || 'Unknown error occurred';
                addMessage(`Error: ${errorMsg}`, 'error');
            })
            .finally(() => {
                typingIndicator.style.display = 'none';
                chatArea.scrollTop = chatArea.scrollHeight;
            });
        }
        
        function addMessage(text, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}-message`;
            
            const bubbleDiv = document.createElement('div');
            bubbleDiv.className = `bubble ${sender}-bubble`;
            
            // Process markdown formatting
            const formattedText = formatMarkdown(text);
            bubbleDiv.innerHTML = formattedText;
            
            const timeDiv = document.createElement('div');
            timeDiv.className = 'time';
            timeDiv.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            
            messageDiv.appendChild(bubbleDiv);
            messageDiv.appendChild(timeDiv);
            
            chatArea.insertBefore(messageDiv, typingIndicator);
            chatArea.scrollTop = chatArea.scrollHeight;
        }
        
        function formatMarkdown(text) {
            // Convert markdown to HTML
            return text
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>') // bold
                .replace(/\*(.*?)\*/g, '<em>$1</em>') // italic
                .replace(/`(.*?)`/g, '<code>$1</code>') // inline code
                .replace(/```([\s\S]*?)```/g, '<pre>$1</pre>') // code blocks
                .replace(/\n\n/g, '<br><br>') // line breaks
                .replace(/\n/g, '<br>'); // single line breaks
        }
    </script>
</body>
</html>
