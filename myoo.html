<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lo Shu Grid Name Calculator</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        h2 { color: #333; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin-bottom: 20px; border: 2px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 16px; text-transform: uppercase; }
        .result-box { background: #e7f3ff; padding: 15px; border-radius: 8px; border: 1px solid #b3d7ff; }
        .number { font-size: 24px; font-weight: bold; color: #007bff; }
        .breakdown { font-size: 14px; color: #555; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Name Number Calculator</h2>
    <p>Apna Naam Likhein:</p>
    <input type="text" id="nameInput" placeholder="Ex: RAHUL" oninput="calculateName()">
    
    <div class="result-box">
        <div>Naam ka Total Number:</div>
        <div id="totalNumber" class="number">0</div>
        <div id="breakdown" class="breakdown">Calculation: -</div>
    </div>
</div>

<script>
    function calculateName() {
        const name = document.getElementById('nameInput').value.toUpperCase();
        
        // Chaldean Numerology Mapping
        const mapping = {
            'A': 1, 'I': 1, 'J': 1, 'Q': 1, 'Y': 1,
            'B': 2, 'K': 2, 'R': 2,
            'C': 3, 'G': 3, 'L': 3, 'S': 3,
            'D': 4, 'M': 4, 'T': 4,
            'E': 5, 'H': 5, 'N': 5, 'X': 5,
            'U': 6, 'V': 6, 'W': 6,
            'O': 7, 'Z': 7,
            'F': 8, 'P': 8
        };

        let sum = 0;
        let details = [];

        for (let char of name) {
            if (mapping[char]) {
                sum += mapping[char];
                details.push(`${char}(${mapping[char]})`);
            }
        }

        // Final single digit reduction (Numerology Rule)
        let finalDigit = sum;
        while (finalDigit > 9) {
            finalDigit = String(finalDigit).split('').reduce((a, b) => parseInt(a) + parseInt(b), 0);
        }

        document.getElementById('totalNumber').innerText = name ? `${sum} → ${finalDigit}` : "0";
        document.getElementById('breakdown').innerText = name ? "Calculation: " + details.join(' + ') : "Calculation: -";
    }
</script>

</body>
</html>
