<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Natural Temperature Editor</title>

<style>
body{
    margin:0;
    padding:20px;
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
    text-align:center;
}

.container{
    max-width:900px;
    margin:auto;
}

canvas{
    width:100%;
    max-width:800px;
    background:#222;
    border-radius:12px;
    margin-top:20px;
}

.controls{
    margin-top:20px;
}

input[type="range"]{
    width:320px;
}

button{
    margin-top:20px;
    padding:12px 20px;
    font-size:16px;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

.info{
    margin-top:10px;
    font-size:18px;
}
</style>
</head>

<body>

<div class="container">

<h2>Natural Display Temperature Editor</h2>

<input type="file" id="upload" accept="image/*">

<div class="controls">

<div class="info">
Temperature:
<span id="value">0</span>
</div>

<input type="range" id="temperature" min="-100" max="100" value="0">

</div>

<canvas id="canvas"></canvas>

<br>

<button id="download">Download High Quality</button>

</div>

<script>
const upload = document.getElementById("upload");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const slider = document.getElementById("temperature");
const value = document.getElementById("value");
const download = document.getElementById("download");

let img = new Image();

upload.addEventListener("change", e => {
  
  const file = e.target.files[0];
  if (!file) return;
  
  const reader = new FileReader();
  
  reader.onload = event => {
    
    img.onload = () => {
      
      canvas.width = img.width;
      canvas.height = img.height;
      
      applyTemperature();
    };
    
    img.src = event.target.result;
  };
  
  reader.readAsDataURL(file);
});

slider.addEventListener("input", () => {
  
  value.textContent = slider.value;
  applyTemperature();
});

function applyTemperature() {
  
  if (!img.src) return;
  
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(img, 0, 0);
  
  const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const data = imageData.data;
  
  const temp = parseInt(slider.value);
  
  for (let i = 0; i < data.length; i += 4) {
    
    let r = data[i];
    let g = data[i + 1];
    let b = data[i + 2];
    
    let y = (r + g) / 2 - b / 2;
    
    if (temp > 0) {
      
      r += temp * 0.6;
      g += temp * 0.4;
      
      y += temp * 0.5;
      
      b -= temp * 0.3;
      
    } else {
      
      const cool = Math.abs(temp);
      
      r -= cool * 0.50;
      g += cool * 0.02;
      
      y -= cool * 0.50;
      
      b += cool * 0.02;
    }
    
    r = clamp(r + y * 0.2);
    g = clamp(g + y * 0.2);
    b = clamp(b - y * 0.1);
    
    data[i] = r;
    data[i + 1] = g;
    data[i + 2] = b;
  }
  
  ctx.putImageData(imageData, 0, 0);
}

function clamp(v) {
  return Math.max(0, Math.min(255, v));
}

download.addEventListener("click", () => {
  
  const link = document.createElement("a");
  link.download = "temperature-image.png";
  link.href = canvas.toDataURL("image/png", 1);
  link.click();
});
</script>

</body>
</html>
