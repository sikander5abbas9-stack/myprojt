<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Precision Touch Gallery</title>
    <style>
        /* Gallery Styles */
        .gallery-container {
            width: 90%;
            height: 300px;
            margin: 20px auto;
            border: 2px solid #ddd;
            position: relative;
            overflow: hidden;
            touch-action: pan-y;
        }

        .gallery-slider {
            display: flex;
            height: 100%;
            transition: transform 0.3s ease-out;
        }

        .gallery-slide {
            min-width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f8f8f8;
            position: relative;
        }

        .gallery-slide img, 
        .gallery-slide video {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .gallery-slide.loaded img, 
        .gallery-slide.loaded video {
            opacity: 1;
        }

        .gallery-counter {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
            z-index: 10;
        }

        /* Non-interactive Skeleton */
        .skeleton-box {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #f0f0f0;
            pointer-events: none; /* Makes skeleton non-interactive */
        }

        /* Page Content */
        .content {
            height: 200vh;
            padding: 20px;
            background: #f5f5f5;
        }
        
        h1 {
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="content">
        <h1>Precision Touch Gallery</h1>
        <p>Scroll normally. Only clear horizontal swipes on the gallery will slide images.</p>
        
        <!-- Gallery 1 -->
        <div id="gallery1"></div>
        
        <p style="text-align: center;">Content between galleries...</p>
        
        <!-- Gallery 2 -->
        <div id="gallery2"></div>
        
        <p style="text-align: center;">Continue scrolling...</p>
    </div>
<script src="slideshow.js"></script>
