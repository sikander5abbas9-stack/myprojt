<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Menu with LocalStorage</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; overflow-x: hidden; }
        .action-bar { position: fixed; top: 0; left: 0; width: 100%; height: 60px; background-color: #42445A00; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; z-index: 1000; }
        .menu-icon, .plus-icon { font-size: 30px; color: #000; }
        
        .side-menu {
            height: 100vh; /* Use full viewport height */
            width: 50%;
            position: fixed;
            top: 0;
            left: -50%;
            background-color: #fff;
            overflow-y: auto; /* Enable vertical scrolling if content overflows */
            transition: 0.5s;
            padding-top: 30px;
            padding-bottom: 100px; /* Add padding at the bottom */
            z-index: 1100;
        }
        
        .side-menu .menu-item { 
            padding: 15px 20px; /* Added more padding for space */
            text-decoration: none; 
            font-size: 22px; 
            color: #000; 
            display: block; 
            position: relative; 
            cursor: default; /* Disable pointer cursor */
        }

        .side-menu .menu-item .date {
            font-size: 14px;
            color: #666;
            margin-top: 5px;
        }
        
        .side-menu .menu-item.selected { background-color: #ADADAD8F; }
        .side-menu .menu-item:hover { background-color: #E6E6E68F; }
        .side-menu.active { left: 0; }
        .three-dots { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); font-size: 20px; }
        .options { display: none; position: absolute; right: 23px; top: 50%; transform: translateY(-50%); background-color: #000000C4; padding: 10px; border-radius: 10px; z-index: 1001; }
        .options button { display: block; width: 100%; padding: 10px; margin: 5px 0; background-color: #7E7E7E; color: white; border: none; }
        .options button:hover { background-color: #666666; }
        iframe { 
          width: 100vw; 
          height: 99.3vh; 
          border: none; 
        }
        .overlay { display: none; position: fixed; top: 0; right: 0; width: 50%; height: 100%; z-index: 1050; }
    </style>
</head>
<body>
    <div class="action-bar">
        <div class="menu-icon" onclick="toggleMenu()">&#9780;</div>
        <div class="plus-icon" onclick="addProject()">&#43;</div>
    </div>
    <div class="side-menu" id="sideMenu"></div>
    <div class="overlay" id="overlay"></div>
    
    <div class="iframe" ma></div>

    <script>
    let projectCount = parseInt(localStorage.getItem("projectCounter")) || 1;
    const STORAGE_KEY = "projectsData";
    const SELECTED_KEY = "selectedProject";

    const loadFromStorage = () => JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    const saveToStorage = (projects) => {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(projects));
        localStorage.setItem(SELECTED_KEY, document.querySelector('.selected')?.id);
    };

    const toggleMenu = () => {
        const sideMenu = document.getElementById("sideMenu");
        const overlay = document.getElementById("overlay");
        sideMenu.classList.toggle("active");
        overlay.style.display = sideMenu.classList.contains("active") ? "block" : "none";
    };

    const addProject = () => {
        const projects = loadFromStorage();
        const newId = `project${Date.now()}`;
        const newProjectName = `Project ${projectCount}`;

        const newProject = document.createElement("div");
        newProject.className = "menu-item";

        const projectName = document.createElement("div");
        projectName.textContent = newProjectName;

        const projectDate = document.createElement("div");
        projectDate.className = "date";
        const currentDate = new Date().toLocaleDateString('en-US', {
            weekday: 'short',
            year: 'numeric',
            month: 'short',
            day: 'numeric'
        });
        projectDate.textContent = ` ${currentDate}`;

        newProject.appendChild(projectName);
        newProject.appendChild(projectDate);
        newProject.id = newId;
        newProject.onclick = (e) => { loadProject(newId, newProject); handleProjectClick(); };

        const threeDots = document.createElement("span");
        threeDots.className = "three-dots"; threeDots.innerHTML = "&#8942;";
        threeDots.onclick = (e) => { e.stopPropagation(); showOptions(threeDots); };

        newProject.appendChild(threeDots);
        document.getElementById("sideMenu").prepend(newProject);

        projects.unshift({ id: newId, name: newProjectName, date: currentDate });
        saveToStorage(projects);

        projectCount++;
        localStorage.setItem("projectCounter", projectCount);

        loadProject(newId, newProject);
    };

    const deleteProjectData = (projectId) => {
        // Remove project-specific data from localStorage
        localStorage.removeItem(projectId);
    };

    const loadProject = (projectId, element) => {
        document.querySelectorAll('.side-menu .menu-item').forEach(item => item.classList.remove('selected'));
        element.classList.add('selected');
        let iframediv = document.querySelector('.iframe');
        iframediv.innerHTML = `<iframe id="mainIframe" src="dokan.html?id=${projectId}"></iframe>`;
        localStorage.setItem(SELECTED_KEY, projectId);
    };

    const showOptions = (element) => {
        // Close all other options first
        document.querySelectorAll('.options').forEach(opt => opt.style.display = 'none');

        let options = element.nextElementSibling;
        if (!options || !options.classList.contains("options")) {
            options = document.createElement("div");
            options.className = "options";
            const deleteBtn = document.createElement("button");
            deleteBtn.textContent = "Delete";
            deleteBtn.onclick = () => {
                const projectId = element.parentElement.id;
                deleteProjectData(projectId);
                element.parentElement.remove();
                const projects = loadFromStorage().filter(p => p.id !== projectId);
                localStorage.setItem(STORAGE_KEY, JSON.stringify(projects));
                activateLastAddedProject();
            };
            const renameBtn = document.createElement("button");
            renameBtn.textContent = "Rename";
            renameBtn.onclick = () => {
                const newName = prompt("Enter new name:");
                if (newName) {
                    element.parentElement.firstChild.textContent = newName;
                    const projects = loadFromStorage().map(p => {
                        if (p.id === element.parentElement.id) {
                            p.name = newName;
                        }
                        return p;
                    });
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(projects));
                }
            };
            options.append(deleteBtn, renameBtn);
            element.parentElement.appendChild(options);
        }
        options.style.display = options.style.display === "block" ? "none" : "block";
    };

    const activateLastAddedProject = () => {
        const projects = loadFromStorage();
        if (projects.length > 0) {
            const lastProjectId = projects[0].id;
            const lastProjectElement = document.getElementById(lastProjectId);
            if (lastProjectElement) loadProject(lastProjectId, lastProjectElement);
        } else {
            document.querySelector('.iframe').innerHTML = '';
            localStorage.removeItem(SELECTED_KEY);
        }
    };

    const handleProjectClick = () => {
        toggleMenu();
        document.querySelectorAll('.options').forEach(opt => opt.style.display = 'none');
    };

    window.onload = () => {
        const projects = loadFromStorage();
        const selectedId = localStorage.getItem(SELECTED_KEY);
        projects.reverse().forEach(proj => {
            const project = document.createElement("div");
            project.className = "menu-item";
            const projectName = document.createElement("div");
            projectName.textContent = proj.name;
            const projectDate = document.createElement("div");
            projectDate.className = "date";
            projectDate.textContent = proj.date;
            project.appendChild(projectName);
            project.appendChild(projectDate);
            project.id = proj.id;
            project.onclick = (e) => { loadProject(proj.id, project); handleProjectClick(); };
            const threeDots = document.createElement("span");
            threeDots.className = "three-dots"; threeDots.innerHTML = "&#8942;";
            threeDots.onclick = (e) => { e.stopPropagation(); showOptions(threeDots); };
            project.appendChild(threeDots);
            document.getElementById("sideMenu").prepend(project);
        });

        if (selectedId) {
            const selectedProject = document.getElementById(selectedId);
            if (selectedProject) {
                loadProject(selectedId, selectedProject);
            } else {
                localStorage.removeItem(SELECTED_KEY);
                activateLastAddedProject();
            }
        }
    };

    document.addEventListener("click", (e) => {
        const sideMenu = document.getElementById("sideMenu");
        const overlay = document.getElementById("overlay");
        if (!sideMenu.contains(e.target) && !e.target.closest('.menu-icon, .plus-icon')) {
            sideMenu.classList.remove("active");
            overlay.style.display = "none";
        }
    });

    document.getElementById("overlay").addEventListener("click", toggleMenu);
</script>
</body>
</html>
