    <h2>Add New Product</h2>
    <input type="text" id="productName" placeholder="Product Name" required>
    <input type="text" id="productCategory" placeholder="Category" required>
    <input type="text" id="productBrand" placeholder="Brand" required>
    <input type="text" id="productImage" placeholder="Image URL" required>
    <input type="text" id="productImages" placeholder="Images URL" required>
    <h5 id="displayUrl"></h5>
    <input type="number" id="productPrice" placeholder="Price" required>

    <button onclick="convertText()">Convert</button>

    <button class="btn" id="addProduct">Add Product</button>

    <!-- New Section for Update/Delete Product -->

    <button class="btn" id="deleteProduct">Delete Product</button>
      <script>
        function convertText() {
          const inputText = document.getElementById("productDescription").value;
          const lines = inputText.split("\n").map(line => `"${line.trim()}"`);
          const result = `[\n  ${lines.join(",\n  ")}\n]`;
          document.getElementById("outputText").textContent = result;
        }
      </script>

    <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import { getFirestore, doc, setDoc, getDoc, updateDoc, deleteDoc, collection, addDoc } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

    // Firebase configuration
    const firebaseConfig = {
  apiKey: "AIzaSyCODU5GVwDHlnb8lyc-w7fcqx25_MS55KA",
  authDomain: "gzjsvkzhhsjhsb.firebaseapp.com",
  projectId: "gzjsvkzhhsjhsb",
  storageBucket: "gzjsvkzhhsjhsb.firebasestorage.app",
  messagingSenderId: "969885928112",
  appId: "1:969885928112:web:5121178f1d0c1125ad8975"
};

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    let isFirstPaste = true;
    
    // Handle pasting multiple URLs
    document.getElementById('productImages').addEventListener('paste', function(event) {
      event.preventDefault();
      const pastedText = event.clipboardData.getData('text');
      const displayUrl = document.getElementById('displayUrl');
    
      if (pastedText) {
        displayUrl.textContent += isFirstPaste ? pastedText : ',' + pastedText;
        isFirstPaste = false;
      }
    
      this.value = '';
    });

    // Add product to Firestore
    document.getElementById("addProduct").addEventListener("click", async () => {
        const descriptionInput = document.getElementById("productDescription").value;
        const formattedDescription = descriptionInput
            .split("\n")
            .map(line => `•  ${line.trim()}`)
            .join("\n");

        const product = {
            name: document.getElementById("productName").value,
            category: document.getElementById("productCategory").value,
            brand: document.getElementById("productBrand").value,
            image: document.getElementById("productImage").value,
            images: document.getElementById("displayUrl").textContent,
            price: parseInt(document.getElementById("productPrice").value),
            cutPrice: document.getElementById("productCutPrice").value || null,
            rating: parseFloat(document.getElementById("productRating").value) || null,
            description: formattedDescription,
        };

        try {
            const docRef = await addDoc(collection(db, "products"), product);
            alert("Product added successfully with ID: " + docRef.id);
            console.log('ya ha id: ' + docRef.id)
        } catch (error) {
            console.error("Error adding product: ", error);
        }
    });
           

    // Fetch product by ID
    document.getElementById("fetchProduct").addEventListener("click", async () => {
        const productId = document.getElementById("productId").value;
        if (!productId) {
            alert("Please enter a product ID.");
            return;
        }

        try {
            const docRef = doc(db, "products", productId);
            const docSnap = await getDoc(docRef);

            if (docSnap.exists()) {
                document.getElementById("productData").value = JSON.stringify(docSnap.data(), null, 4);
            } else {
                alert("No product found with this ID.");
            }
        } catch (error) {
            console.error("Error fetching product: ", error);
        }
    });

    // Update product
    document.getElementById("updateProduct").addEventListener("click", async () => {
        const productId = document.getElementById("productId").value;
        const updatedData = JSON.parse(document.getElementById("productData").value);

        if (!productId || !updatedData) {
            alert("Please provide both product ID and updated data.");
            return;
        }

        try {
            const docRef = doc(db, "products", productId);
            await updateDoc(docRef, updatedData);
            alert("Product updated successfully!");
        } catch (error) {
            console.error("Error updating product: ", error);
        }
    });

    // Delete product
    document.getElementById("deleteProduct").addEventListener("click", async () => {
        const productId = document.getElementById("productId").value;

        if (!productId) {
            alert("Please enter a product ID.");
            return;
        }

        try {
            const docRef = doc(db, "products", productId);
            await deleteDoc(docRef);
            alert("Product deleted successfully!");
        } catch (error) {
            console.error("Error deleting product: ", error);
        }
    });
</script>
</body>
