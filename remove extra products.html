<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Manager</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        h1 {
            color: #088178;
            text-align: center;
        }
        .btn-container {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-bottom: 30px;
        }
        .btn {
            padding: 12px 24px;
            background-color: #088178;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            min-width: 250px;
        }
        .btn:hover {
            background-color: #065e54;
        }
        .btn:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        .btn-add {
            background-color: #4CAF50;
        }
        .btn-add:hover {
            background-color: #3e8e41;
        }
        .progress-container {
            margin: 20px 0;
            padding: 15px;
            border-radius: 5px;
            background-color: #f5f5f5;
        }
        .progress-bar {
            height: 20px;
            background-color: #e0e0e0;
            border-radius: 10px;
            margin-top: 10px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background-color: #088178;
            width: 0%;
            transition: width 0.3s ease;
        }
        .results {
            margin-top: 20px;
        }
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .product-card {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            background: white;
        }
        .product-image {
            width: 100%;
            height: 200px;
            object-fit: contain;
            background-color: #f9f9f9;
            border-radius: 5px;
            margin-bottom: 10px;
        }
        .product-info {
            margin-top: 10px;
        }
        .bad-image {
            border: 2px solid red;
        }
        .status {
            font-weight: bold;
            margin-top: 5px;
        }
        .to-be-deleted {
            background-color: #ffebee;
        }
        .summary {
            margin-top: 20px;
            padding: 15px;
            background-color: #f5f5f5;
            border-radius: 5px;
        }
        .tabs {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 1px solid #ddd;
        }
        .tab {
            padding: 10px 20px;
            cursor: pointer;
            background-color: #f1f1f1;
            border: 1px solid #ddd;
            border-bottom: none;
            border-radius: 5px 5px 0 0;
            margin-right: 5px;
        }
        .tab.active {
            background-color: white;
            border-bottom: 1px solid white;
            margin-bottom: -1px;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
    </style>
</head>
<body>
    <h1>Product Manager</h1>
    
    <div class="tabs">
        <div class="tab active" data-tab="validate">Validate Products</div>
        <div class="tab" data-tab="add">Add Random Products</div>
    </div>
    
    <!-- Validate Products Tab -->
    <div id="validateTab" class="tab-content active">
        <button id="validateBtn" class="btn">Validate Product Images</button>
        
        <div class="progress-container">
            <div id="progressText">Ready to validate products</div>
            <div class="progress-bar">
                <div id="progressFill" class="progress-fill"></div>
            </div>
        </div>
        
        <div id="results" class="results">
            <div id="productGrid" class="product-grid"></div>
            <div id="summary" class="summary" style="display: none;"></div>
        </div>
    </div>
    
    <!-- Add Random Products Tab -->
    <div id="addTab" class="tab-content">
        <button id="addRandomBtn" class="btn btn-add">Add 10 Verified Random Products</button>
        
        <div class="progress-container">
            <div id="addProgressText">Ready to add products</div>
            <div class="progress-bar">
                <div id="addProgressFill" class="progress-fill"></div>
            </div>
        </div>
        
        <div id="addResults" class="results">
            <div id="addedProductGrid" class="product-grid"></div>
            <div id="addSummary" class="summary" style="display: none;"></div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.x/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.x/firebase-firestore.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-app.js";
        import { 
            getFirestore, 
            collection, 
            getDocs, 
            deleteDoc, 
            doc,
            addDoc
        } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-firestore.js";

        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyABgd07aVz6KEOh30iSo1j70dQBluMbjgA",
            authDomain: "gjgsjgjdhyd6yehbdt6gebsigdjgd.firebaseapp.com",
            projectId: "gjgsjgjdhyd6yehbdt6gebsigdjgd",
            storageBucket: "gjgsjgjdhyd6yehbdt6gebsigdjgd.firebasestorage.app",
            messagingSenderId: "246983910789",
            appId: "1:246983910789:web:ec9f59c2f74a72b324d0ec"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Tab functionality
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                
                tab.classList.add('active');
                document.getElementById(`${tab.dataset.tab}Tab`).classList.add('active');
            });
        });

        // ================== VALIDATE PRODUCTS ================== //
        
        // Function to check if image URL is valid
        async function checkImage(url) {
            return new Promise((resolve) => {
                if (!url || url.trim() === "" || url === "null") {
                    resolve(false);
                    return;
                }
                
                const img = new Image();
                img.onload = () => resolve(true);
                img.onerror = () => resolve(false);
                img.src = url;
                
                // Timeout if image takes too long to load
                setTimeout(() => {
                    if (!img.complete) resolve(false);
                }, 2000);
            });
        }

        // Main validation function
        async function validateProductImages() {
            const button = document.getElementById('validateBtn');
            const progressText = document.getElementById('progressText');
            const progressFill = document.getElementById('progressFill');
            const productGrid = document.getElementById('productGrid');
            const summaryDiv = document.getElementById('summary');
            
            // Reset UI
            button.disabled = true;
            productGrid.innerHTML = "";
            summaryDiv.style.display = "none";
            progressFill.style.width = "0%";
            
            try {
                // Get all products from Firestore
                progressText.textContent = "Fetching products from Firestore...";
                const productsQuery = collection(db, "products");
                const querySnapshot = await getDocs(productsQuery);
                const allProducts = querySnapshot.docs.map(doc => ({
                    id: doc.id,
                    ...doc.data()
                }));
                
                const totalProducts = allProducts.length;
                let checkedCount = 0;
                let invalidCount = 0;
                let deletedCount = 0;
                
                progressText.textContent = `Checking ${totalProducts} products...`;
                
                // Check each product's image
                for (const product of allProducts) {
                    const productCard = document.createElement('div');
                    productCard.className = 'product-card';
                    productCard.id = `product-${product.id}`;
                    
                    // Display product info immediately
                    productCard.innerHTML = `
                        <img src="${product.image || 'https://via.placeholder.com/300x300?text=No+Image'}" 
                             alt="${product.name}" 
                             class="product-image"
                             onerror="this.src='https://via.placeholder.com/300x300?text=Image+Error'">
                        <div class="product-info">
                            <div><strong>${product.name || 'Unnamed Product'}</strong></div>
                            <div>ID: ${product.id}</div>
                            <div class="status">Checking image...</div>
                        </div>
                    `;
                    productGrid.appendChild(productCard);
                    
                    // Check if image URL is valid
                    const isValid = await checkImage(product.image);
                    checkedCount++;
                    const progressPercent = Math.round((checkedCount / totalProducts) * 100);
                    progressFill.style.width = `${progressPercent}%`;
                    
                    const statusElement = productCard.querySelector('.status');
                    const imageElement = productCard.querySelector('.product-image');
                    
                    if (!isValid) {
                        invalidCount++;
                        statusElement.textContent = "❌ Invalid image - Will be deleted";
                        statusElement.style.color = "red";
                        imageElement.classList.add('bad-image');
                        productCard.classList.add('to-be-deleted');
                        
                        // Actually delete the product from Firestore
                        try {
                            await deleteDoc(doc(db, "products", product.id));
                            deletedCount++;
                            statusElement.textContent = "❌ Deleted (invalid image)";
                        } catch (error) {
                            console.error(`Error deleting product ${product.id}:`, error);
                            statusElement.textContent = "❌ Delete failed (check console)";
                        }
                    } else {
                        statusElement.textContent = "✅ Valid image";
                        statusElement.style.color = "green";
                    }
                    
                    // Small delay to prevent UI freezing
                    await new Promise(resolve => setTimeout(resolve, 100));
                }
                
                // Show summary
                summaryDiv.style.display = "block";
                summaryDiv.innerHTML = `
                    <h3>Validation Summary</h3>
                    <p>Total products checked: ${totalProducts}</p>
                    <p>Products with invalid images: ${invalidCount}</p>
                    <p>Products successfully deleted: ${deletedCount}</p>
                    <p>Products with valid images: ${totalProducts - invalidCount}</p>
                `;
                
                progressText.textContent = `Validation complete! ${invalidCount} invalid products found and ${deletedCount} deleted.`;
                
            } catch (error) {
                console.error("Error during validation:", error);
                progressText.textContent = `Error: ${error.message}`;
            } finally {
                button.disabled = false;
            }
        }

        // ================== ADD RANDOM PRODUCTS ================== //

        // List of verified working image URLs
        const verifiedImages = [
            "https://m.media-amazon.com/images/I/71an9eiBxpL._AC_UL320_.jpg", // Shoes
            "https://m.media-amazon.com/images/I/61L5QgPvgLL._AC_UL320_.jpg",  // Watch
            "https://m.media-amazon.com/images/I/71cQWYVtcBL._AC_UL320_.jpg",  // Headphones
            "https://m.media-amazon.com/images/I/71qj7fpsUsL._AC_UL320_.jpg",  // T-Shirt
            "https://m.media-amazon.com/images/I/71TPda7cwUL._AC_UL320_.jpg",  // Speaker
            "https://m.media-amazon.com/images/I/61BGE6iu4AL._AC_UL320_.jpg",  // Bag
            "https://m.media-amazon.com/images/I/71H4+IlGmYL._AC_UL320_.jpg",  // Jacket
            "https://m.media-amazon.com/images/I/71WkDp--uqL._AC_UL320_.jpg",  // Charger
            "https://m.media-amazon.com/images/I/71rXSVqET9L._AC_UL320_.jpg",  // Smartphone
            "https://m.media-amazon.com/images/I/71OZY035QCL._AC_UL320_.jpg"   // Laptop
        ];

        // Generate random products with verified images
        function generateRandomProducts(count) {
            const brands = ["Nike", "Adidas", "Puma", "Apple", "Samsung", "Sony", "Bose", "Levi's", "Zara", "H&M"];
            const categories = ["electronics", "clothing", "footwear", "accessories", "home", "beauty"];
            const adjectives = ["Premium", "Pro", "Lite", "Max", "Ultra", "Smart", "Wireless", "Portable"];
            const nouns = ["Watch", "Shoes", "T-Shirt", "Headphones", "Speaker", "Charger", "Bag", "Jacket"];
            
            const products = [];
            
            for (let i = 0; i < count; i++) {
                const brand = brands[Math.floor(Math.random() * brands.length)];
                const category = categories[Math.floor(Math.random() * categories.length)];
                const adjective = adjectives[Math.floor(Math.random() * adjectives.length)];
                const noun = nouns[Math.floor(Math.random() * nouns.length)];
                const name = `${brand} ${adjective} ${noun}`;
                
                const price = Math.floor(Math.random() * 900) + 100; // 100-1000
                const cutPrice = Math.floor(price * (1 + Math.random() * 0.3)); // 0-30% more than price
                const rating = (Math.random() * 2 + 3).toFixed(1); // 3.0-5.0
                
                // Get verified image URLs
                const mainImage = verifiedImages[Math.floor(Math.random() * verifiedImages.length)];
                const additionalImages = [
                    verifiedImages[Math.floor(Math.random() * verifiedImages.length)],
                    verifiedImages[Math.floor(Math.random() * verifiedImages.length)]
                ];
                
                products.push({
                    name: name,
                    brand: brand.toLowerCase(),
                    category: category,
                    image: mainImage,
                    images: [mainImage, ...additionalImages].join(","),
                    price: price,
                    cutPrice: cutPrice,
                    rating: parseFloat(rating),
                    description: `This is a ${adjective.toLowerCase()} ${noun.toLowerCase()} from ${brand}. Perfect for your ${category} needs.`,
                    keywords: [brand.toLowerCase(), category, noun.toLowerCase(), adjective.toLowerCase()]
                });
            }
            
            return products;
        }

        // Add random products function
        async function addRandomProducts() {
            const button = document.getElementById('addRandomBtn');
            const progressText = document.getElementById('addProgressText');
            const progressFill = document.getElementById('addProgressFill');
            const productGrid = document.getElementById('addedProductGrid');
            const summaryDiv = document.getElementById('addSummary');
            
            // Reset UI
            button.disabled = true;
            productGrid.innerHTML = "";
            summaryDiv.style.display = "none";
            progressFill.style.width = "0%";
            
            try {
                // Generate random products
                progressText.textContent = "Generating random products...";
                const randomProducts = generateRandomProducts(10);
                let addedCount = 0;
                let failedCount = 0;
                
                progressText.textContent = `Adding products to Firestore (0/${randomProducts.length})...`;
                
                // Add each product to Firestore
                for (const product of randomProducts) {
                    const productCard = document.createElement('div');
                    productCard.className = 'product-card';
                    
                    // Display product info immediately
                    productCard.innerHTML = `
                        <img src="${product.image}" 
                             alt="${product.name}" 
                             class="product-image">
                        <div class="product-info">
                            <div><strong>${product.name}</strong></div>
                            <div>₹${product.price} ${product.cutPrice ? `<span style="text-decoration:line-through;color:#999">₹${product.cutPrice}</span>` : ''}</div>
                            <div class="status">Adding to database...</div>
                        </div>
                    `;
                    productGrid.appendChild(productCard);
                    
                    try {
                        // Add to Firestore
                        const docRef = await addDoc(collection(db, "products"), product);
                        addedCount++;
                        
                        // Update card with success
                        const statusElement = productCard.querySelector('.status');
                        statusElement.textContent = "✅ Added successfully";
                        statusElement.style.color = "green";
                        productCard.innerHTML += `<div>ID: ${docRef.id}</div>`;
                    } catch (error) {
                        console.error(`Error adding product ${product.name}:`, error);
                        failedCount++;
                        
                        const statusElement = productCard.querySelector('.status');
                        statusElement.textContent = "❌ Failed to add";
                        statusElement.style.color = "red";
                    }
                    
                    // Update progress
                    const progressPercent = Math.round(((addedCount + failedCount) / randomProducts.length) * 100);
                    progressFill.style.width = `${progressPercent}%`;
                    progressText.textContent = `Adding products to Firestore (${addedCount + failedCount}/${randomProducts.length})...`;
                    
                    // Small delay to prevent UI freezing
                    await new Promise(resolve => setTimeout(resolve, 300));
                }
                
                // Show summary
                summaryDiv.style.display = "block";
                summaryDiv.innerHTML = `
                    <h3>Addition Summary</h3>
                    <p>Total products generated: ${randomProducts.length}</p>
                    <p>Products successfully added: ${addedCount}</p>
                    <p>Products failed to add: ${failedCount}</p>
                `;
                
                progressText.textContent = `Addition complete! ${addedCount} products added successfully.`;
                
            } catch (error) {
                console.error("Error during addition:", error);
                progressText.textContent = `Error: ${error.message}`;
            } finally {
                button.disabled = false;
            }
        }

        // Set up button click handlers
        document.getElementById('validateBtn').addEventListener('click', validateProductImages);
        document.getElementById('addRandomBtn').addEventListener('click', addRandomProducts);
    </script>
</body>
</html>
